name: Normalize existing Releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release_cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout v1.4.0
        uses: actions/checkout@v4
        with:
          ref: v1.4.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Run v1.4.0 tests
        shell: pwsh
        run: python -m unittest -v test_ais_monthly_app.py

      - name: Build v1.4.0 Windows EXE
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Create normalized v1.4.0 package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'release_package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath '.\dist\AIS_32方位月報工具.exe' -Destination $stage -Force
          Copy-Item -LiteralPath '.\使用說明.txt' -Destination $stage -Force

          $zip = Join-Path $PWD 'AIS_32_Direction_Monthly_Report_v1.4.0.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          $exeHash = (Get-FileHash -LiteralPath '.\dist\AIS_32方位月報工具.exe' -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          @(
            "$zipHash  AIS_32_Direction_Monthly_Report_v1.4.0.zip"
            "$exeHash  AIS_32方位月報工具.exe"
          ) | Set-Content -LiteralPath '.\SHA256SUMS.txt' -Encoding utf8NoBOM

          "zip_hash=$zipHash" >> $env:GITHUB_OUTPUT
          "exe_hash=$exeHash" >> $env:GITHUB_OUTPUT

      - name: Write normalized Release notes
        shell: pwsh
        run: |
          @'
          首個可分享的 Windows 執行版本，將原本分散的每月 Excel 產製流程整合為單頁工具。

          ## 📥 下載

          Windows 一般使用者請下載：

          `AIS_32_Direction_Monthly_Report_v0.0.1.zip`

          解壓縮後執行 `AIS_32方位月報工具.exe`，不需要安裝 Python。

          ## ✨ 本版重點

          - 自動辨識 `D&TMOK KLNG_YYYYMMDD_23.xlsx` 每日資料。
          - 依年月自動建立正確天數，不再人工修改大月／小月設定。
          - 同次執行產生新版分析與原格式相容版。
          - 整合 32 方位選值、多工處理、快取、錯誤紀錄與進度顯示。
          - 完全離線執行，不需要 Token、API Key 或網路服務。

          ## ✅ 驗證

          - 自動測試：7 項通過。
          - Windows EXE：已實跑雙格式 Excel 輸出。

          ## ⚠️ 已知限制

          - 本版本以 KLNG 流程為主要使用情境。
          - 航向、岸向異常與待複核內容仍需由領域人員人工確認。

          ## 🔐 SHA-256

          ZIP：

          `A985022C05C1FDC23A7070DFFA9AB4F28387F139E8ACF2BAB76D28AB2F7C6E9B`

          其他檔案請依本 Release 的 `SHA256SUMS.txt` 驗證。

          ## ⬆️ 從舊版升級

          這是首個公開測試版本；目前建議優先使用最新 Release。

          ## 📋 完整變更

          詳見 repository 的 `CHANGELOG.md`。
          '@ | Set-Content -LiteralPath '.\notes-v0.0.1.md' -Encoding utf8NoBOM

          @'
          本版本將月份辨識、工作表尋找與 Windows 封裝流程進一步自動化，降低每月例行處理的人工作業。

          ## 📥 下載

          Windows 一般使用者請下載：

          `AIS_32_Direction_Monthly_Report_v1.3.0.zip`

          解壓縮後執行 `AIS_32方位月報工具.exe`，不需要安裝 Python。

          ## ✨ 本版重點

          - 從 `D&TMOK KLNG_YYYYMMDD_*.xlsx` 自動辨識年月。
          - GUI 支援多月份資料夾選擇，CLI 可自動推斷年月。
          - 自動尋找包含必要 AIS 欄位的工作表，可處理前置封面／說明分頁。
          - worker 預設值依電腦自動限制在 1–3。
          - 改善 Windows Tcl/Tk 與 PyInstaller 封裝相容性。

          ## ✅ 驗證

          - 自動測試：12/12 通過。
          - `python -m py_compile ais_monthly_app.py`：通過。
          - Windows EXE：建置成功。
          - Source / EXE smoke test：以遮罩樣本通過。

          ## ⚠️ 已知限制

          - 月報中的待複核項目仍需由領域人員完成人工複核。
          - 本版未修改 32 方位研究定義、21 個海向、500 NM、10% + 至少 3 筆群聚、bearing/distance 邏輯或 AIS 去重。
          - 32 方位邊界、21 海向研究依據與是否需要去重等既有 UNKNOWN 仍未定案。

          ## 🔐 SHA-256

          ZIP：

          `F959564A946E9B540F1A5E234AA565E3EA23DC7EB2F58EFC320ED3A743CCC00F`

          EXE：

          `317BFBA50D4C7132AB39CCF2827D82F902998A7C150CE2AEE246BFD08D4FFFCF`

          ## ⬆️ 從舊版升級

          直接下載 v1.3.0 正式 ZIP 並解壓使用即可；不需要沿用舊版程式檔。

          ## 📋 完整變更

          詳見 repository 的 `CHANGELOG.md`。
          '@ | Set-Content -LiteralPath '.\notes-v1.3.0.md' -Encoding utf8NoBOM

          $zipHash = '${{ steps.package.outputs.zip_hash }}'
          $exeHash = '${{ steps.package.outputs.exe_hash }}'
          @"
          本版本加入 Multi-port 支援，可從 D&TMOK 檔名自動辨識港別並安全處理多港、多月份來源。

          ## 📥 下載

          Windows 一般使用者請下載：

          ``AIS_32_Direction_Monthly_Report_v1.4.0.zip``

          解壓縮後執行 ``AIS_32方位月報工具.exe``，不需要安裝 Python。

          ## ✨ 本版重點

          - 支援從 ``D&TMOK <PORT>_YYYYMMDD_*.xlsx`` 自動辨識港別。
          - 港別代碼支援 2–16 位英數字，不限制為預先列出的港口清單。
          - GUI 新增港別選擇；切換港別時月份清單同步更新。
          - CLI 新增可選的 ``--port``；唯一港別維持免指定相容性。
          - Cache 與 legacy spool 依港別、年份與月份隔離。
          - 輸出檔名、工作簿標題、log 與錯誤報告使用實際港別代碼。

          ## ✅ 驗證

          - 自動測試：24/24 通過。
          - KLNG regression：通過。
          - 真實 HWLN smoke test：通過。
          - 真實 HWLN 樣本：151,665 data rows。
          - 126,488 rows 納入新版分析。
          - 1,347 rows 因距離 >500 NM 排除。
          - Source / EXE 32 方位結果一致。
          - 新版 / legacy 結果一致。
          - 無 KLNG 殘留、無 exception。

          ## ⚠️ 已知限制

          - 月報中的待複核項目仍需由領域人員人工確認。
          - 本版未修改研究演算法、32 方位、21 海向、500 NM、10%／至少 3 筆群聚或 AIS 去重規則。
          - 32 方位邊界、21 海向研究依據、D&TMOK 上游規格與 AIS 去重等既有 UNKNOWN 仍未定案。

          ## 🔐 SHA-256

          ZIP：

          ``$zipHash``

          EXE：

          ``$exeHash``

          ## ⬆️ 從舊版升級

          可直接下載 v1.4.0 ZIP 並解壓使用。因 cache / legacy spool 格式已升級並加入港別隔離，舊格式快取不應跨版本沿用。

          ## 📋 完整變更

          詳見 repository 的 ``CHANGELOG.md``。
          "@ | Set-Content -LiteralPath '.\notes-v1.4.0.md' -Encoding utf8NoBOM

      - name: Normalize Release titles and descriptions
        shell: pwsh
        run: |
          gh release edit v0.0.1 --repo $env:GITHUB_REPOSITORY --title 'AIS 32 方位月報工具 v0.0.1' --notes-file '.\notes-v0.0.1.md'
          gh release edit v1.3.0 --repo $env:GITHUB_REPOSITORY --title 'AIS 32 方位月報工具 v1.3.0' --notes-file '.\notes-v1.3.0.md'
          gh release edit v1.4.0 --repo $env:GITHUB_REPOSITORY --title 'AIS 32 方位月報工具 v1.4.0' --notes-file '.\notes-v1.4.0.md'

      - name: Normalize v1.4.0 assets
        shell: pwsh
        run: |
          gh release upload v1.4.0 `
            '.\AIS_32_Direction_Monthly_Report_v1.4.0.zip' `
            '.\SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY --clobber

          $assets = gh release view v1.4.0 --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($assets -contains 'AIS_32DirectionMonthlyReport_v1.4.0.exe') {
            gh release delete-asset v1.4.0 'AIS_32DirectionMonthlyReport_v1.4.0.exe' --repo $env:GITHUB_REPOSITORY --yes
          }

      - name: Verify normalized Releases
        shell: pwsh
        run: |
          gh release view v0.0.1 --repo $env:GITHUB_REPOSITORY
          gh release view v1.3.0 --repo $env:GITHUB_REPOSITORY
          gh release view v1.4.0 --repo $env:GITHUB_REPOSITORY
